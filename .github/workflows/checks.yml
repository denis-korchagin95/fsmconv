name: Checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jcunit
        run: |
          git clone --branch v1.0.0 --depth 1 https://github.com/denis-korchagin95/jcunit.git /tmp/jcunit
          sudo make -C /tmp/jcunit install

      - name: Build
        run: |
          mkdir -p obj bin
          make build

      - name: Test
        run: jcunit --no-cache tests/
