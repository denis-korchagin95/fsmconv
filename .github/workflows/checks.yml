name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jcunit
        run: |
          curl -L https://github.com/denis-korchagin95/jcunit/releases/download/v1.0.0/jcunit-linux-amd64 -o jcunit
          chmod +x jcunit
          sudo mv jcunit /usr/local/bin/

      - name: Build
        run: |
          mkdir -p obj bin
          make build

      - name: Test
        run: jcunit --no-cache tests/
